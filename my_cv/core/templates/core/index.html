         <script>
  const slides = document.querySelectorAll(".slider img");
let index = 0;

function update() {

  const prevIndex = (index - 1 + slides.length) % slides.length;
  const nextIndex = (index + 1) % slides.length;
  const farPrevIndex = (index - 2 + slides.length) % slides.length;
  const farNextIndex = (index + 2) % slides.length;

  slides.forEach((img, i) => {

    img.classList.remove(
      "active",
      "prev",
      "next",
      "far-prev",
      "far-next",
      "hidden"
    );

    if (i === index) {
      img.classList.add("active");
    }

    else if (i === prevIndex) {
      img.classList.add("prev");
    }

    else if (i === nextIndex) {
      img.classList.add("next");
    }

    else if (i === farPrevIndex) {
      img.classList.add("far-prev");
    }

    else if (i === farNextIndex) {
      img.classList.add("far-next");
    }

    else {
      img.classList.add("hidden");
    }

    // CLICK LOGIKA (bitno: pojednostavljeno)
    img.onclick = () => {
      index = i;
      update();
    };
  });
}

update();
let interval = setInterval(next, 4000);

function next() {
  index = (index + 1) % slides.length;
  update();
}

const slider = document.querySelector(".slider");

slider.addEventListener("mouseenter", () => {
  clearInterval(interval);
});

slider.addEventListener("mouseleave", () => {
  interval = setInterval(next, 1500);
});

// Touch swipe support
let touchStartX = 0;
slider.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  clearInterval(interval);
}, { passive: true });

slider.addEventListener("touchend", e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 40) {
    if (diff > 0) {
      index = (index + 1) % slides.length;
    } else {
      index = (index - 1 + slides.length) % slides.length;
    }
    update();
  }
  interval = setInterval(next, 4000);
}, { passive: true });

const musicbtn = document.getElementById('musicbtn');
const audio = document.getElementById('audio');
const wrapper = document.querySelector(".slider-wrapper");

const pauseSVG = `<svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>`;

function setUI() {
    const isPlaying = !audio.paused;

    musicbtn.innerHTML = isPlaying ? pauseSVG : "🎧";
    musicbtn.classList.toggle("playing", isPlaying);
    wrapper.classList.toggle("playing", isPlaying);
}

function toggleMusic() {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
    setUI();
}

musicbtn.addEventListener('click', toggleMusic);

audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    setUI();
});

document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
        e.preventDefault();
        toggleMusic();
    }
});
        </script>
